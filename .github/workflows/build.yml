name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o VideoGrab.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle -p VideoGrab assembleDebug --no-daemon
      - run: cp VideoGrab/app/build/outputs/apk/debug/app-debug.apk VideoGrab.apk
      - uses: actions/upload-artifact@v4
        with: { name: VideoGrab-apk, path: VideoGrab.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VideoGrab (latest)
          files: VideoGrab.apk
